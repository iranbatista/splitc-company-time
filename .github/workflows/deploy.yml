name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Mudança só no Worker não precisa republicar o site.
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Pages serve em https://<usuario>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # URL do Worker + /v1. Ex.: https://splitc-notion-proxy.SEU.workers.dev/v1
          API_BASE: ${{ vars.API_BASE }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
